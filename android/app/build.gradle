plugins {
    id 'com.android.application'
}

android {
    namespace 'com.andxiaoqie.earphonewire'
    compileSdk 35

    defaultConfig {
        applicationId 'com.andxiaoqie.earphonewire'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.2.0-local-reader'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
