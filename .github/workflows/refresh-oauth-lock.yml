name: Refresh OAuth lockfile

on:
  push:
    branches:
      - fix/chatgpt-cimd-oauth-provider-0.10.2
    paths:
      - ".github/workflows/refresh-oauth-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Refresh package lock
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- server/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git commit -m "Refresh OAuth provider lockfile"
          git push
